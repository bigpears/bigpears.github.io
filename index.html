<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tomáš Hruška</title>
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #38bdf8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
    padding: 4rem 1.5rem;
    min-height: 100vh;
  }
  main {
    max-width: 640px;
    width: 100%;
  }
  h1 {
    font-size: 2.25rem;
    margin-bottom: 0.5rem;
  }
  .tagline {
    color: var(--muted);
    font-size: 1.1rem;
    margin-bottom: 2.5rem;
  }
  section {
    margin-bottom: 2.5rem;
  }
  h2 {
    font-size: 1rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--accent);
    margin-bottom: 0.75rem;
  }
  p {
    line-height: 1.6;
    color: var(--text);
  }
  ul {
    list-style: none;
  }
  li {
    margin-bottom: 0.5rem;
  }
  a {
    color: var(--accent);
    text-decoration: none;
  }
  a:hover {
    text-decoration: underline;
  }
  .links {
    display: flex;
    gap: 1.5rem;
    flex-wrap: wrap;
  }
  footer {
    color: var(--muted);
    font-size: 0.85rem;
    margin-top: 3rem;
  }
</style>
</head>
<body>
<main>
  <h1>Tomáš Hruška</h1>
  <p class="tagline">Product Owner &mdash; welcome to my personal pages.</p>

  <section>
    <h2>About</h2>
    <p>
      This is a simple personal page. Update this section with a short bio,
      your interests, or what you're currently working on.
    </p>
  </section>

  <section>
    <h2>Links</h2>
    <ul class="links">
      <li><a href="https://github.com/" target="_blank" rel="noopener">GitHub</a></li>
      <li><a href="https://www.linkedin.com/" target="_blank" rel="noopener">LinkedIn</a></li>
      <li><a href="mailto:t.hruska@comap-control.com">Email</a></li>
    </ul>
  </section>

  <footer>
    &copy; <span id="year"></span> Tomáš Hruška
  </footer>
</main>

<script>
  document.getElementById('year').textContent = new Date().getFullYear();
</script>
</body>
</html>
